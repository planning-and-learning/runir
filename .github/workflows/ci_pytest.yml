name: CI Pytest

on:
  push:
    branches-ignore:
      - test-pypi
  pull_request:

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  RUNIR_JOBS: "2"
  TYR_JOBS: "2"
  LOKI_JOBS: "2"
  YGGDRASIL_JOBS: "2"

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ["3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CMake on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Install dependencies and requirements
        run: |
          python -m pip install --no-cache-dir --upgrade pip
        env:
          PIP_NO_CACHE_DIR: 1

      - name: Build and install
        run: python -m pip install --no-cache-dir --verbose .[test]
        env:
          PIP_NO_CACHE_DIR: 1

      - name: Diag weak symbols
        run: |
          sp=$(python -c 'import sysconfig; print(sysconfig.get_paths()["platlib"])')
          weak() { nm -gmU "$1" | grep 'weak external' | awk '{print $NF}' | sort -u; }
          weak "$sp/pyrunir/native/lib/librunir_kr.dylib" > kr.txt
          weak "$sp/pytyr/native/lib/libtyr_core.dylib" > tyr.txt
          comm -12 kr.txt tyr.txt > shared.txt
          echo "DIAGSHARED count=$(wc -l < shared.txt)"
          c++filt < shared.txt | grep -E 'urd::|ygg' | cut -c1-300 | sed 's/^/DIAGSHARED /' | head -80
          nm -gmU "$sp/pyrunir/native/lib/librunir_kr.dylib" | c++filt | grep -E 'object_pair_indices|with_context' | cut -c1-300 | sed 's/^/DIAGKR /' | head -20
          otool -L "$sp/pyrunir/_pyrunir.abi3.so" | sed 's/^/DIAGLINK /'
          otool -L "$sp/pyrunir/native/lib/librunir_kr.dylib" | sed 's/^/DIAGLINK /'
      - name: Test
        run: pytest -s -p no:cacheprovider python/tests/kr/dl/test_diag_role_views.py; pytest python/tests
