name: CI Pytest

on:
  push:
    branches-ignore:
      - test-pypi
  pull_request:

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  RUNIR_JOBS: "2"
  TYR_JOBS: "2"
  LOKI_JOBS: "2"
  YGGDRASIL_JOBS: "2"

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ["3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CMake on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Install dependencies and requirements
        run: |
          python -m pip install --no-cache-dir --upgrade pip
        env:
          PIP_NO_CACHE_DIR: 1

      - name: Build and install
        run: python -m pip install --no-cache-dir --verbose .[test]
        env:
          PIP_NO_CACHE_DIR: 1

      - name: Diag disassembly
        run: |
          sp=$(python -c 'import sysconfig; print(sysconfig.get_paths()["platlib"])')
          so="$sp/pyrunir/_pyrunir.abi3.so"
          nm "$so" | awk '{print $1, $2, $3}' > syms.txt
          grep -E 'object_pair_indices|7indicesE' syms.txt | while read a t m; do echo "DIAGSYM $a $t $m $(echo $m | c++filt | cut -c1-400)"; done | head -40
          for m in $(grep -E 'object_pair_indices' syms.txt | awk '{print $3}' | head -4) $(grep -E '7indicesEv' syms.txt | grep -E 'RoleTag|7RoleTag' | awk '{print $3}' | head -6); do
            echo "DIAGASM ===== $(echo $m | c++filt | cut -c1-300)"
            objdump --disassemble-symbols="$m" --no-show-raw-insn "$so" 2>&1 | head -120 | sed 's/^/DIAGASM /'
          done
      - name: Test
        run: pytest -s -p no:cacheprovider python/tests/kr/dl/test_diag_role_views.py; pytest python/tests
