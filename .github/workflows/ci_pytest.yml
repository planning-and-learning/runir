name: CI Pytest

on:
  push:
    branches-ignore:
      - test-pypi
  pull_request:

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  RUNIR_JOBS: "2"
  TYR_JOBS: "2"
  LOKI_JOBS: "2"
  YGGDRASIL_JOBS: "2"

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ["3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CMake on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Install dependencies and requirements
        run: |
          python -m pip install --no-cache-dir --upgrade pip
        env:
          PIP_NO_CACHE_DIR: 1

      - name: Build and install
        run: python -m pip install --no-cache-dir --verbose .[test]
        env:
          PIP_NO_CACHE_DIR: 1

      - name: Diag AppleClang constraint mangling
        run: |
          cat > m.cpp <<'CPP'
          template<class T, class U> concept same_as_ = __is_same(T, U);
          struct A {}; struct B {};
          template<class C> struct M {
              auto f() const noexcept requires same_as_<C, A> { return 1; }
              auto f() const noexcept requires same_as_<C, B> { return 2.0; }
              static auto pick() { return static_cast<decltype(M{}.f()) (M::*)() const noexcept>(&M::f); }
          };
          double g() { M<B> m; return (m.*M<B>::pick())(); }
          CPP
          c++ --version | head -1 | sed 's/^/DIAGMANGLE /'
          c++ -std=c++20 -c m.cpp -o m.o 2>&1 | sed 's/^/DIAGMANGLE /' || true
          nm m.o | sed 's/^/DIAGMANGLE /' || true
          c++ -std=c++23 -c m.cpp -o m.o 2>&1 | sed 's/^/DIAGMANGLE c++23 /' || true
          nm m.o | sed 's/^/DIAGMANGLE c++23 /' || true
      - name: Test
        run: pytest python/tests
