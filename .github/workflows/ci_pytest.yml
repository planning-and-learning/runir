name: CI Pytest

on:
  push:
    branches-ignore:
      - test-pypi
  pull_request:

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  RUNIR_JOBS: "2"
  TYR_JOBS: "2"
  LOKI_JOBS: "2"
  YGGDRASIL_JOBS: "2"

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ["3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CMake on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Install dependencies and requirements
        run: |
          python -m pip install --no-cache-dir --upgrade pip
        env:
          PIP_NO_CACHE_DIR: 1

      - name: Build and install
        run: python -m pip install --no-cache-dir --verbose .[test]
        env:
          PIP_NO_CACHE_DIR: 1

      - name: Diag weak symbols
        run: |
          sp=$(python -c 'import sysconfig; print(sysconfig.get_paths()["platlib"])')
          for f in $(find "$sp" \( -name '*.so' -o -name '*.dylib' \) | grep -E 'pyurd|pyyggdrasil|pytyr|pyvefr|pyrunir|pypddl'); do
            echo "DIAGSO $f exported=$(nm -gU "$f" | wc -l) weak=$(nm -gmU "$f" | grep -c 'weak external')"
            nm -gmU "$f" | grep 'weak external' | c++filt | grep -E 'with_context|transformed_range|SetBitIndices|object_pair_indices|BitsetSpan' | cut -c1-400 | head -20 | sed "s/^/DIAGSYM /"
          done
          otool -L "$sp/pyrunir/_pyrunir.abi3.so" | sed "s/^/DIAGLINK /"
      - name: Test
        run: pytest -s -p no:cacheprovider python/tests/kr/dl/test_diag_role_views.py; pytest python/tests
