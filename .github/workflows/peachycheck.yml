name: peachycheck

on:
  pull_request:
  push:
    branches: [main]

jobs:
  peachycheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: drexlerd/peachycheck@v0.1.0
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        with:
          # clang-tidy needs compile_commands.json, pyright the package in
          # .venv with its mcp extra, which the explore server imports (the
          # stubs are generated at install). The native
          # dependencies come with the pyyggdrasil, pypddl and pytyr wheels.
          prepare: |
            "$PYTHON" -m venv .venv
            .venv/bin/python -m pip install 'scikit-build-core>=1.0.3,<2' 'cmake>=3.21' 'ninja>=1.5' \
              'nanobind-backend>=1.0' 'pybrokkr>=0.1.2,<0.2' 'pyyggdrasil>=0.7.2,<0.8' 'pypddl>=1.8.0,<1.9' 'pytyr>=0.8.0,<0.9' \
              'pypddl-datasets>=0.0.17,<0.1'
            PREFIX="$(.venv/bin/python -c 'import pytyr, pypddl, pyyggdrasil; print(f"{pytyr.native_prefix()};{pypddl.native_prefix()};{pyyggdrasil.native_prefix()}")')"
            cmake -S . -B build/peachycheck -G Ninja -DCMAKE_MAKE_PROGRAM="$PWD/.venv/bin/ninja" \
                  -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                  -DRUNIR_BUILD_TESTS=ON -DRUNIR_BUILD_EXECUTABLES=ON -DRUNIR_BUILD_PYRUNIR=ON \
                  -DCMAKE_PREFIX_PATH="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib \
                  -DPython_EXECUTABLE="$PWD/.venv/bin/python" -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
            .venv/bin/python -m pip install --no-build-isolation ".[test,mcp]"
